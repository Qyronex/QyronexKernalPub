[package]
name = "kernal-core-aarch64"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "kernal-core-aarch64"
path = "src/main.rs"
test = false
bench = false

[dependencies]
