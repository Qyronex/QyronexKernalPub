[workspace.package]
edition = "2024"
license = "LicenseRef-Qyronex-Kernal-NC-1.0"
rust-version = "1.98"

[profile.dev]
panic = "abort"
opt-level = 1

# Runner workspace-test jobs execute in one-shot temporary worktrees, so incremental artifacts and
# debug-symbol objects cannot be reused by a later job and only increase peak disk use. Keep test
# code, debug assertions and optimization semantics unchanged while bounding the ephemeral footprint.
[profile.test]
incremental = false
debug = 0

[profile.release]
panic = "abort"
opt-level = 3
lto = "thin"
codegen-units = 1
